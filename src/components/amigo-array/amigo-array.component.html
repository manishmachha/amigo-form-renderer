<div class="amigo-array-wrapper flex flex-col gap-4">
  <label class="block text-sm font-medium text-slate-800" *ngIf="field.label">
    {{ field.label }} <span *ngIf="field.required" class="text-red-500">*</span>
  </label>
  <div 
    *ngFor="let groupCtrl of formArray.controls; let i = index" 
    class="border border-gray-300 rounded-md overflow-hidden bg-white shadow-sm"
  >
    <div class="px-4 py-2 border-b border-slate-200 bg-slate-50 flex items-center justify-between">
      <h4 class="font-semibold text-sm text-slate-800">
        {{ groupLabel }} {{ i + 1 }} <span *ngIf="field.required" class="text-red-500">*</span>
      </h4>
      <button 
        *ngIf="canRemove" 
        type="button" 
        (click)="removeGroup(i)"
        class="text-xs px-3 py-1 bg-red-600 text-white rounded hover:bg-red-700 transition-colors"
      >
        Remove
      </button>1
    </div>
    
    <div class="p-4">
      <div 
        class="grid" 
        [ngStyle]="{
          'grid-template-columns': 'repeat(' + (resolvedSchema?.layout?.columns || 1) + ', minmax(0, 1fr))',
          'column-gap': (resolvedSchema?.spacing?.gapX ?? 12) + 'px',
          'row-gap': (resolvedSchema?.spacing?.gapY ?? 12) + 'px'
        }"
      >
        <div
          *ngFor="let childField of field.fieldArray?.fields"
          [ngStyle]="{ 'grid-column': 'span ' + (childField.colSpan || 1) }"
          [ngClass]="resolvedSchema?.style?.fieldWrapperClass || 'mb-3'"
        >
          <amigo-field-renderer
            [field]="childField"
            [form]="$any(groupCtrl)"
            [resolvedSchema]="resolvedSchema"
            [isSubmitting]="isSubmitting"
            [buttonLoading]="buttonLoading"
            [buttonFeedback]="buttonFeedback"
            [selectState]="selectState"
            (buttonClick)="buttonClick.emit($event)"
            (fileChange)="fileChange.emit($event)"
            (clearFile)="clearFile.emit($event)"
          ></amigo-field-renderer>
        </div>
      </div>
    </div>
  </div>

  <div class="mt-2" *ngIf="canAdd">
    <button 
      type="button" 
      (click)="addGroup()"
      class="text-sm px-4 py-2 bg-indigo-600 text-white rounded hover:bg-indigo-700 transition-colors shadow-sm inline-flex items-center gap-1 font-medium"
    >
      + Add {{ groupLabel }}
    </button>
  </div>
</div>
