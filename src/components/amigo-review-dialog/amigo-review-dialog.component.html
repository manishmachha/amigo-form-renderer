<div class="bg-white flex flex-col max-h-[90vh]">
  <div class="px-6 py-4 border-b border-gray-200 flex justify-between items-center shrink-0">
    <h3 class="text-lg font-semibold text-gray-800 m-0">Review Form Details</h3>
    <button type="button" (click)="onClose()" class="text-gray-400 hover:text-gray-600 focus:outline-none bg-transparent border-none cursor-pointer p-0">
      <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
    </button>
  </div>
  
  <div class="p-6 overflow-y-auto flex-1">
    <div *ngFor="let stepData of reviewData" class="mb-6 last:mb-0">
      <h4 class="font-medium text-blue-700 border-b border-gray-100 pb-2 mb-4 mt-0">{{ stepData.step }}</h4>
      <div class="grid grid-cols-1 md:grid-cols-2 gap-x-6 gap-y-4">
        <div *ngFor="let fData of stepData.fields" class="flex flex-col">
          <span class="text-xs text-gray-500 mb-1">{{ fData.label }}</span>
          <span class="text-sm font-medium text-gray-800 break-words whitespace-pre-wrap">{{ fData.value }}</span>
        </div>
      </div>
    </div>
  </div>
  
  <div class="px-6 py-4 border-t border-gray-200 flex justify-end gap-3 bg-gray-50 shrink-0">
    <button type="button" class="px-4 py-2 text-sm border border-gray-300 rounded bg-white hover:bg-gray-100 text-gray-700 cursor-pointer transition-colors" (click)="onClose()">Edit Form</button>
    <button type="button" class="px-4 py-2 text-sm bg-blue-600 border border-blue-600 text-white rounded hover:bg-blue-700 cursor-pointer transition-colors shadow-sm" (click)="onConfirm()">Confirm & Close</button>
  </div>
</div>
