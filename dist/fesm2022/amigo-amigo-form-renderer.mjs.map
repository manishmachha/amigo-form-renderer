<div class="w-full">
  <button
    [type]="field.button?.isSubmit ? 'submit' : 'button'"
    (click)="onButtonClickHandler()"
    [disabled]="isLoading"
    class="w-full transition disabled:opacity-60 disabled:cursor-not-allowed"
    (mouseenter)="isHovered = true"
    (mouseleave)="isHovered = false"
    [style.borderRadius.px]="resolvedSchema?.style?.borderRadius"
    [ngStyle]="{
      'background-color':
        field.button?.styleVariant === 'link' ||
        field.button?.styleVariant === 'outline'
          ? isHovered
            ? field.button?.hoverBackgroundColor ||
              (field.button?.styleVariant === 'outline'
                ? '#eff6ff'
                : 'transparent')
            : field.button?.backgroundColor || 'transparent'
          : isHovered
            ? field.button?.hoverBackgroundColor ||
              field.button?.backgroundColor ||
              ''
            : field.button?.backgroundColor || '',
      color: isHovered
        ? field.button?.hoverTextColor ||
          field.button?.textColor ||
          ''
        : field.button?.textColor || '',
      'border-color':
        field.button?.styleVariant === 'link'
          ? 'transparent'
          : isHovered
            ? field.button?.hoverBackgroundColor ||
              field.button?.backgroundColor ||
              ''
            : field.button?.backgroundColor || '',
      'text-decoration':
        field.button?.styleVariant === 'link' && isHovered
          ? 'underline'
          : 'none',
    }"
    [ngClass]="[
      resolvedSchema?.style?.inputClass
        ? resolvedSchema.style.inputClass.replace('rounded', '')
        : 'w-full px-2 py-1 text-sm',
      field.button?.styleVariant === 'link' ? '' : 'border',
      !field.button?.backgroundColor &&
      (field.button?.styleVariant || 'primary') === 'primary'
        ? 'bg-blue-600 text-white border-blue-600 hover:bg-blue-700'
        : !field.button?.backgroundColor &&
            field.button?.styleVariant === 'outline'
          ? 'bg-transparent text-blue-600 border-blue-600 hover:bg-blue-50'
          : !field.button?.backgroundColor &&
              field.button?.styleVariant === 'link'
            ? 'bg-transparent text-blue-600 border-transparent hover:underline'
            : !field.button?.backgroundColor &&
                (field.button?.styleVariant || 'primary') === 'danger'
              ? 'bg-red-600 text-white border-red-600 hover:bg-red-700'
              : !field.button?.backgroundColor
                ? 'bg-white text-slate-700 border-slate-300 hover:bg-slate-50'
                : '',
    ]"
  >
    <span class="inline-flex items-center justify-center gap-2">
      <span>
        {{
          field.button?.isSubmit && isSubmitting
            ? "Submitting..."
            : field.button?.label || field.label
        }}
      </span>
      <span
        *ngIf="!field.button?.isSubmit && buttonLoading[field.id]"
        class="text-xs opacity-80"
        >…</span
      >
    </span>
  </button>

  <div
    *ngIf="buttonFeedback[field.id]"
    class="mt-2 text-xs rounded-lg px-3 py-2 border"
    [ngClass]="
      buttonFeedback[field.id].type === 'success'
        ? 'bg-emerald-50 border-emerald-200 text-emerald-800'
        : 'bg-rose-50 border-rose-200 text-rose-800'
    "
  >
    {{ buttonFeedback[field.id].message }}
  </div>
</div>
