<div class="w-full h-full flex flex-col mb-6 overflow-auto">
  <div
    *ngIf="isLoading"
    class="flex items-center justify-center p-6 text-sm text-gray-600"
  >
    Loading form…
  </div>

  <div
    *ngIf="loadError"
    class="p-3 rounded border border-red-200 bg-red-50 text-red-700 text-sm"
  >
    {{ loadError }}
  </div>

  <div
    *ngIf="
      !isLoading &&
      !loadError &&
      (!resolvedSchema?.fields || resolvedSchema.fields.length === 0)
    "
    class="flex justify-center items-center h-100 border border-dotted border-gray-300 rounded-xl bg-white"
  >
    <h2 class="text-sm text-gray-600">No fields found for this form schema.</h2>
  </div>

  <form
    *ngIf="!isLoading && !loadError && resolvedSchema?.fields?.length && form"
    [formGroup]="form"
    class="text-sm"
    [ngStyle]="getFormStyle()"
    [ngClass]="resolvedSchema?.style?.formClass || ''"
    (ngSubmit)="submit()"
  >
    <h2 class="text-2xl my-2">{{ resolvedSchema.name }}</h2>

    <p
      *ngIf="resolvedSchema.description"
      class="text-[13px] text-gray-500 mb-4"
    >
      {{ resolvedSchema.description }}
    </p>

    <amigo-stepper
      *ngIf="isMultiStep"
      [orderedSteps]="orderedSteps"
      [activeStepIndex]="activeStepIndex"
      [totalSteps]="totalSteps"
      [visibleFieldsCount]="visibleFields.length"
      (stepChanged)="setActiveStep($event)"
    ></amigo-stepper>

    <div *ngIf="isSectional; else normalOrMulti">
      <div *ngFor="let sec of orderedSections" class="mb-6 bg-white border border-gray-200 rounded-lg p-5 shadow-sm">
        <div
          class="flex items-center justify-between mb-4 border-b border-gray-100 pb-3"
        >
          <h3 class="text-sm font-semibold text-gray-800">
            {{ sec.label }}
          </h3>
          <span
            class="text-[11px] text-gray-500 bg-gray-100 px-2 py-1 rounded"
            *ngIf="fieldsForSection(sec.id) as fields"
          >
            {{ fields.length }} {{ fields.length === 1 ? "field" : "fields" }}
          </span>
        </div>

        <div
          class="grid"
          [ngStyle]="{
            'grid-template-columns':
              'repeat(' +
              (resolvedSchema.layout?.columns || 1) +
              ', minmax(0, 1fr))',
            'column-gap': (resolvedSchema.spacing?.gapX ?? 12) + 'px',
            'row-gap': (resolvedSchema.spacing?.gapY ?? 12) + 'px',
          }"
        >
          <div
            *ngFor="
              let field of fieldsForSection(sec.id);
              trackBy: trackByFieldId
            "
            [ngStyle]="{ 'grid-column': 'span ' + (field.colSpan || 1) }"
            [ngClass]="resolvedSchema.style?.fieldWrapperClass || 'mb-3'"
          >
            <ng-container
              *ngTemplateOutlet="fieldRenderer; context: { $implicit: field }"
            ></ng-container>
          </div>
        </div>

        <div
          *ngIf="fieldsForSection(sec.id).length === 0"
          class="text-xs text-gray-400 mt-2 italic"
        >
          No fields in this section yet.
        </div>
      </div>
    </div>

    <ng-template #normalOrMulti>
      <div
        class="grid"
        [ngStyle]="{
          'grid-template-columns':
            'repeat(' +
            (resolvedSchema.layout?.columns || 1) +
            ', minmax(0, 1fr))',
          'column-gap': (resolvedSchema.spacing?.gapX ?? 12) + 'px',
          'row-gap': (resolvedSchema.spacing?.gapY ?? 12) + 'px',
        }"
      >
        <div
          *ngFor="let field of visibleFields; trackBy: trackByFieldId"
          [ngStyle]="{ 'grid-column': 'span ' + (field.colSpan || 1) }"
          [ngClass]="resolvedSchema.style?.fieldWrapperClass || 'mb-3'"
        >
          <ng-container
            *ngTemplateOutlet="fieldRenderer; context: { $implicit: field }"
          ></ng-container>
        </div>
      </div>
    </ng-template>

    <div
      *ngIf="isMultiStep"
      class="mt-4 flex items-center justify-between text-xs w-full"
    >
      <!-- Previous Step Button / Placeholder -->
      <button
        *ngIf="activeStepIndex > 0"
        type="button"
        class="px-3 py-1 border border-gray-300 rounded hover:bg-gray-100 disabled:opacity-50"
        (click)="prevStep()"
      >
        ← Previous step
      </button>
      <div *ngIf="activeStepIndex === 0"></div>

      <!-- Next Step Button -->
      <button
        *ngIf="activeStepIndex < totalSteps - 1"
        type="button"
        class="px-3 py-1 border border-gray-300 rounded hover:bg-gray-100 disabled:opacity-50"
        (click)="nextStep()"
      >
        Next step →
      </button>

      <!-- Review Button -->
      <button
        *ngIf="activeStepIndex === totalSteps - 1 && !isReviewed"
        type="button"
        class="px-3 py-1 border border-blue-600 rounded bg-blue-600 text-white hover:bg-blue-700 disabled:opacity-50"
        (click)="openReviewDialog()"
      >
        Review Details
      </button>
    </div>

    <div
      *ngIf="submitFeedback"
      class="mt-3 p-3 rounded border text-sm"
      [ngClass]="
        submitFeedback.type === 'success'
          ? 'border-green-200 bg-green-50 text-green-700'
          : 'border-red-200 bg-red-50 text-red-700'
      "
    >
      {{ submitFeedback.message }}
    </div>

    <ng-template #fieldRenderer let-field>
      <amigo-field-renderer
        [field]="field"
        [form]="form"
        [resolvedSchema]="resolvedSchema"
        [isSubmitting]="isSubmitting"
        [buttonLoading]="buttonLoading"
        [buttonFeedback]="buttonFeedback"
        [selectState]="selectState"
        (buttonClick)="onSchemaButtonClick($event)"
        (fileChange)="onFileChange($event.evt, $event.field)"
        (clearFile)="clearFiles($event.field, $event.inputEl)"
      ></amigo-field-renderer>
    </ng-template>
  </form>
</div>

<ng-template #reviewDialogTemplate>
  <amigo-review-dialog
    [reviewData]="reviewData"
    (close)="closeReviewDialog()"
    (confirm)="confirmReview()"
  ></amigo-review-dialog>
</ng-template>
